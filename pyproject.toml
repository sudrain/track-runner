[project]
name = "Track-Runner"
version = "0.1.0"
description = "Дневник тренировок"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.17",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
]

[tool.ruff]
line-length = 80
target-version = "py312"

[dependency-groups]
dev = [
    "odfpy>=1.4.1",
    "pytest>=9.0.3",
]
